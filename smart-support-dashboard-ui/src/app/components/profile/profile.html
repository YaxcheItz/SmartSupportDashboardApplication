<div class="profile-wrapper">
  <div class="profile-container">
    <div class="profile-header">
      <div class="avatar-large">{{ user()?.username?.charAt(0)?.toUpperCase() }}</div>
      <h2>Configuración de Perfil</h2>
      <p class="subtitle">Actualiza tu información personal y contraseña.</p>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" formControlName="username" class="disabled-input">
        <p class="field-hint">El nombre de usuario no se puede cambiar.</p>
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" formControlName="email" placeholder="tu@correo.com">
      </div>

      <div class="form-group">
        <label>Nueva Contraseña</label>
        <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres">
        <p class="field-hint">Deja en blanco si no deseas cambiarla.</p>
      </div>

      <div class="profile-actions">
        <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid || isLoading()">
          {{ isLoading() ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </form>
  </div>
</div>
