<div class="form-wrapper" style="min-height: 70vh;">
  <div class="form-container" style="max-width: 400px;">

    <div class="form-header">
      <div class="header-icon">🔐</div>
      <h2>Acceso Agentes</h2>
      <p class="subtitle">Inicia sesión para gestionar los tickets de soporte.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="ticket-form">

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input id="email" type="email" formControlName="email" placeholder="agente@empresa.com">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input id="password" type="password" formControlName="password" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading()">
        @if (!isLoading()) {
          <span class="btn-content">Ingresar al Sistema <span class="btn-icon">→</span></span>
        } @else {
          <span class="loading-state"><span class="spinner"></span> Validando...</span>
        }
      </button>

    </form>
  </div>
</div>
