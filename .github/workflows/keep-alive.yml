name: Keep Alive Backend

on:
  schedule:
    # Se ejecuta cada 2 horas (a los minutos :00 de las horas pares en UTC)
    # Mantiene activa la base de datos en Supabase y despierta a Render periódicamente
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite ejecutar el ping manualmente desde la pestaña Actions en GitHub

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Ejecutando ping a https://smart-support-dashboard.onrender.com/api/health/ping ..."
          RESPONSE=$(curl -sS --max-time 60 https://smart-support-dashboard.onrender.com/api/health/ping)
          echo "Respuesta del servidor:"
          echo "$RESPONSE"
