spring.application.name=smart-support-dashboard

# CONFIGURACIÓN DE BASE DE DATOS
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Solución para compatibilidad (Supabase / Postgres)
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Desactivar escaneo de repositorios Redis (Redis solo se usa como cache)
spring.data.redis.repositories.enabled=false

# Silenciar warning de AuthenticationProvider en logs
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# IA - CONFIGURACIÓN DE GEMINI
gemini.api.key=${GEMINI_API_KEY:no_key_provided}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# JWT Config
app.jwt.secret=${JWT_SECRET_APP:super_secret_key_that_is_very_very_long_to_satisfy_the_hmac_sha_256_algorithm_requirements_9876543210}
jwt.expirationMs=86400000

# Solución para error "prepared statement already exists" (PgBouncer/Supabase)
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Optimización HikariCP para Supabase Pooler (evita conexiones fantasma y timeouts)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# SUPABASE STORAGE
supabase.url=${SUPABASE_URL:https://no-url-provided.supabase.co}
supabase.key=${SUPABASE_KEY:no_key_provided}

# RESEND EMAIL API
resend.api.key=${RESEND_API_KEY:no_key_provided}
resend.from.email=onboarding@resend.dev
