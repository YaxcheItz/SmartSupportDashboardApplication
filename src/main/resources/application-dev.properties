# application-dev.properties - Solo para uso local sin Docker
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Forzamos una clave larga para evitar el error de los 32 bits
# Si el usuario tiene una variable real en el sistema, esta la sobreescribirá.
app.jwt.secret=esta_es_una_clave_de_desarrollo_local_extremadamente_larga_y_segura_para_evitar_errores_99999
jwt.expirationMs=86400000

# Quitamos las sobreescrituras falsas para que use las del archivo .env real
# gemini.api.key=... (eliminado)
# supabase.url=... (eliminado)
