# application-test.properties
# Archivo de propiedades específico para el entorno de pruebas

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Asegurarse de anular las variables del sistema que puedan estar activas
SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb
SPRING_DATASOURCE_USERNAME=sa
SPRING_DATASOURCE_PASSWORD=password

# Variables de entorno simuladas para evitar errores de inyección en las pruebas
JWT_SECRET=super_secret_test_key_that_is_long_enough_for_hs256_algorithm_1234567890
GEMINI_API_KEY=test_gemini_key
SUPABASE_URL=http://localhost:8000
SUPABASE_KEY=test_supabase_key
RESEND_API_KEY=test_resend_key
